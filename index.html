<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="초등학교 6학년 2학기 수학 1단원 분수의 나눗셈을 조작 활동으로 익히는 학습 앱. 여섯 차시를 구체물·그림·식·연습 네 단계로 공부합니다.">
<meta name="theme-color" content="#EDF3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1820" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="분수 나눗셈">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<title>분수의 나눗셈 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">

<style>
/* ── 토큰 ─────────────────────────────────────────────── */
:root{
  --ground:#EDF3F6; --surface:#FFFFFF; --surface-2:#F6FAFB; --surface-3:#E9F1F4;
  --ink:#112330; --ink-2:#3E5A69; --ink-3:#728B98;
  --line:#D4E1E8; --line-strong:#A9C2CE;
  --teal:#0E7A85; --teal-2:#12949F; --teal-soft:#D8EDEF; --teal-ink:#08525A;
  --accent:#DE5B26; --accent-2:#EE7743; --accent-soft:#FBE6DB; --accent-ink:#8E3410;
  --good:#1B7F55; --good-soft:#DDF1E7;
  --warn:#B0700C; --warn-soft:#FAEDD6;
  --shadow-1:0 1px 2px rgba(17,35,48,.06);
  --shadow-2:0 2px 4px rgba(17,35,48,.05), 0 14px 30px -18px rgba(17,35,48,.38);
  --r:14px; --r-lg:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0A1820; --surface:#122630; --surface-2:#16303A; --surface-3:#1D3B47;
    --ink:#E9F2F6; --ink-2:#A9C3CF; --ink-3:#7C99A7;
    --line:#264350; --line-strong:#3A6273;
    --teal:#4CC3CD; --teal-2:#6FD6DE; --teal-soft:#0E333A; --teal-ink:#9FE4EA;
    --accent:#FF7C46; --accent-2:#FF9668; --accent-soft:#3B2019; --accent-ink:#FFC5A9;
    --good:#4FC98C; --good-soft:#0F2E20;
    --warn:#E4A93F; --warn-soft:#2C2314;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 2px 4px rgba(0,0,0,.3), 0 14px 30px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#0A1820; --surface:#122630; --surface-2:#16303A; --surface-3:#1D3B47;
  --ink:#E9F2F6; --ink-2:#A9C3CF; --ink-3:#7C99A7;
  --line:#264350; --line-strong:#3A6273;
  --teal:#4CC3CD; --teal-2:#6FD6DE; --teal-soft:#0E333A; --teal-ink:#9FE4EA;
  --accent:#FF7C46; --accent-2:#FF9668; --accent-soft:#3B2019; --accent-ink:#FFC5A9;
  --good:#4FC98C; --good-soft:#0F2E20;
  --warn:#E4A93F; --warn-soft:#2C2314;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 4px rgba(0,0,0,.3), 0 14px 30px -18px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:18px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.dsp{font-family:"Gothic A1","Malgun Gothic",system-ui,sans-serif;font-weight:800;letter-spacing:-.01em}
button{font-family:inherit;font-size:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ── 앱 골격 ──────────────────────────────────────────── */
#app{min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1220px;margin:0 auto;padding:0 24px}

.topbar{
  position:sticky;top:0;z-index:40;background:var(--surface);
  border-bottom:1px solid var(--line);box-shadow:var(--shadow-1);
}
.topbar .wrap{display:flex;align-items:center;gap:20px;min-height:70px}
.brand{display:flex;align-items:baseline;gap:10px;font-family:"Gothic A1",sans-serif;font-weight:800;font-size:1.15rem}
.brand .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);align-self:center;flex:none}
.brand small{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:.7rem;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}
.spacer{flex:1}

.iconbtn{
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);
  border-radius:10px;padding:9px 14px;cursor:pointer;font-size:.9rem;font-weight:600;
}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}

/* ── 홈 ───────────────────────────────────────────────── */
.hero{padding:52px 0 30px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:.78rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-size:clamp(2.1rem,4.4vw,3.1rem);margin:14px 0 16px;text-wrap:balance;line-height:1.15}
.hero p{max-width:60ch;color:var(--ink-2);font-size:1.08rem;margin:0}
.flowline{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:26px}
.flowline .fl{
  display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:8px 16px 8px 10px;font-size:.92rem;font-weight:600;color:var(--ink-2);
}
.flowline .fl b{
  width:26px;height:26px;border-radius:50%;background:var(--surface-3);color:var(--ink-2);
  display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:.8rem
}
.flowline .arw{color:var(--line-strong);font-weight:700}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:20px;padding:14px 0 60px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:24px 24px 20px;text-align:left;cursor:pointer;box-shadow:var(--shadow-1);
  transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  display:flex;flex-direction:column;gap:14px;color:inherit;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-2);border-color:var(--line-strong)}
.card .no{
  font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:.76rem;letter-spacing:.14em;
  color:var(--accent);text-transform:uppercase
}
.card h3{margin:0;font-size:1.28rem;line-height:1.3}
.card .sub{color:var(--ink-3);font-size:.92rem;margin:-6px 0 0}
.card .expr{
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;display:flex;align-items:center;gap:10px;justify-content:center
}
.dots{display:flex;gap:6px;align-items:center;margin-top:auto}
.dots i{width:26px;height:7px;border-radius:4px;background:var(--surface-3);display:block}
.dots i.on{background:var(--good)}
.dots span{margin-left:6px;font-size:.8rem;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}

/* ── 차시 화면 ────────────────────────────────────────── */
.lessonhead{background:var(--surface);border-bottom:1px solid var(--line)}
.lessonhead .wrap{padding-top:16px;padding-bottom:0}
.lh-top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.lh-top .no{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--accent);font-size:.8rem;letter-spacing:.14em}
.lh-top h2{margin:0;font-size:1.45rem}
.lh-top .goal{color:var(--ink-3);font-size:.92rem}
.steps{display:flex;gap:8px;margin-top:16px;overflow-x:auto;padding-bottom:2px}
.steps button{
  flex:1;min-width:150px;border:0;border-bottom:4px solid var(--line);background:none;
  padding:12px 8px 12px;text-align:left;cursor:pointer;color:var(--ink-3);
}
.steps button .k{font-family:"IBM Plex Mono",monospace;font-size:.72rem;font-weight:600;letter-spacing:.1em;display:block}
.steps button .t{font-family:"Gothic A1",sans-serif;font-weight:700;font-size:1rem;display:block;margin-top:2px}
.steps button.cur{color:var(--ink);border-bottom-color:var(--accent)}
.steps button.ok{color:var(--good);border-bottom-color:var(--good)}
.steps button:disabled{cursor:not-allowed;opacity:.5}

main{flex:1;padding:26px 0 130px}

.task{
  display:flex;gap:16px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);
  border-left:6px solid var(--accent);border-radius:12px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow-1)
}
.task .lab{
  font-family:"IBM Plex Mono",monospace;font-size:.7rem;font-weight:600;letter-spacing:.14em;
  color:var(--accent);background:var(--accent-soft);padding:5px 9px;border-radius:6px;flex:none;margin-top:3px
}
.task .txt{font-size:1.16rem;font-weight:500;line-height:1.55}
.task .txt em{font-style:normal;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:5px}

.stage{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:30px;box-shadow:var(--shadow-2);min-height:400px;display:flex;flex-direction:column;gap:26px
}
.board{display:flex;flex-direction:column;gap:22px}
.panel{display:flex;flex-direction:column;gap:18px}
.hr{height:1px;background:var(--line);border:0;margin:0}

.scene{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.scene>h4{margin:0 0 16px;font-size:.95rem;font-family:"IBM Plex Mono",monospace;font-weight:600;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
.row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
.center{justify-content:center}
.note{font-size:.92rem;color:var(--ink-3)}
.tag{font-size:.8rem;font-weight:600;font-family:"IBM Plex Mono",monospace;letter-spacing:.06em;padding:4px 10px;border-radius:6px}
.tag.t{background:var(--teal-soft);color:var(--teal-ink)}
.tag.a{background:var(--accent-soft);color:var(--accent-ink)}

/* ── 분수 표기 ────────────────────────────────────────── */
.fr{display:inline-flex;align-items:center;gap:7px;vertical-align:middle;font-family:"IBM Plex Mono",monospace;font-weight:600}
.fr .w{font-size:1.9rem;line-height:1}
.fr .st{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05}
.fr .st .n{padding:0 4px}
.fr .st .d{padding:0 4px;border-top:2.5px solid currentColor;margin-top:3px}
.fr,.eq{font-size:1.55rem}
.fr.sm{font-size:1.1rem}
.fr.lg{font-size:2.1rem}
.eq{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;font-weight:600}
.eq .op{color:var(--ink-3);font-size:1.5rem}
.eq .num{font-family:"IBM Plex Mono",monospace}
.c-t{color:var(--teal)} .c-a{color:var(--accent)}

/* 빈칸 입력 */
input.blank{
  width:3.2ch;min-width:56px;height:58px;text-align:center;font-family:"IBM Plex Mono",monospace;
  font-weight:600;font-size:1.5rem;color:var(--ink);background:var(--surface);
  border:2.5px dashed var(--line-strong);border-radius:10px;padding:0 4px;
}
input.blank:hover{border-color:var(--accent)}
input.blank:focus{outline:none;border-style:solid;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
input.blank.ok{border-style:solid;border-color:var(--good);background:var(--good-soft);color:var(--good)}
input.blank.no{border-style:solid;border-color:var(--accent);background:var(--accent-soft);animation:shake .32s}
.fr input.blank{height:44px;min-width:48px;font-size:1.2rem;border-width:2px;border-radius:8px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* ── 막대 모형 ────────────────────────────────────────── */
.barwrap{display:flex;flex-direction:column;gap:7px;width:100%}
.barlabel{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--ink-2);font-weight:600}
.bar{
  display:grid;height:80px;border:2.5px solid var(--line-strong);border-radius:12px;
  background:var(--surface);overflow:hidden;position:relative;
}
.bar.h56{height:56px}
.cell{border-right:1.5px solid var(--line);position:relative;transition:background .15s}
.cell:last-child{border-right:0}
.cell.f{background:var(--teal-soft);border-right-color:var(--teal)}
.cell.f::after{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--teal);opacity:.75}
.cell.fa{background:var(--accent-soft);border-right-color:var(--accent)}
.cell.fa::after{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--accent);opacity:.8}
.cell.pick{cursor:grab}
.cell.pick:hover{box-shadow:inset 0 0 0 3px var(--teal)}
.cell.gone{background:repeating-linear-gradient(45deg,transparent,transparent 6px,var(--surface-3) 6px,var(--surface-3) 12px)}
.cell.cnt{cursor:pointer}
.cell.cnt:hover{background:var(--accent-soft)}
.cell .mark{
  position:absolute;inset:0;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;
  font-weight:600;font-size:1.05rem;color:var(--accent-ink)
}
.scale{display:grid;font-family:"IBM Plex Mono",monospace;font-size:.78rem;color:var(--ink-3)}
.scale span{text-align:center;border-left:1px solid var(--line);padding-top:3px}
.scale span:first-child{border-left:0}

/* 묶음 표시 */
.grp{position:absolute;top:0;bottom:0;border:3px solid var(--accent);border-radius:9px;pointer-events:none;background:transparent}
.grp b{position:absolute;top:4px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-family:"IBM Plex Mono",monospace;font-size:.72rem;padding:2px 8px;border-radius:6px}

/* ── 담는 그릇(화분/컵/접시) ──────────────────────────── */
.vessels{display:flex;gap:14px;flex-wrap:wrap}
.vessel{
  width:112px;border:2.5px dashed var(--line-strong);border-radius:12px;background:var(--surface);
  display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;position:relative;height:104px;
}
.vessel.on{border-color:var(--accent);border-style:solid;background:var(--accent-soft);box-shadow:0 0 0 4px var(--accent-soft)}
.vessel .fillbar{background:var(--teal);opacity:.42;width:100%;transition:height .2s ease}
.vessel .cap{position:absolute;z-index:2;top:6px;left:0;right:0;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:.78rem;color:var(--ink-2)}
.vessel .cnt{position:absolute;z-index:2;bottom:6px;left:0;right:0;text-align:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:.95rem;color:var(--ink)}
.vessel.full{border-color:var(--good);border-style:solid}
.vessel .half{position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--accent)}

/* ── 드래그 토큰 ──────────────────────────────────────── */
.token{
  min-width:78px;height:78px;border-radius:12px;display:grid;place-items:center;cursor:grab;
  background:var(--teal-soft);border:2.5px solid var(--teal);color:var(--teal-ink);
  font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:1.05rem;user-select:none;
  box-shadow:var(--shadow-1);transition:transform .12s
}
.token:hover{transform:translateY(-2px)}
.token.a{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.token.used{opacity:.35;cursor:not-allowed;transform:none}
.token.locked{border-style:dashed;cursor:not-allowed;opacity:.7}
/* 실제 양과 같은 폭으로 보이는 틀·자 카드 */
.token.ftok{position:relative;overflow:hidden;min-width:0;padding:0}
.token.ftok .g{position:absolute;inset:0;display:grid;pointer-events:none}
.token.ftok .g i{border-right:2px dashed currentColor;opacity:.45}
.token.ftok .g i:last-child{border-right:0}
.token.ftok .l{position:relative;z-index:2;font-size:1rem;white-space:nowrap}
.ftok-holder{width:100%;display:flex}
#ghost{position:fixed;z-index:900;pointer-events:none;transform:translate(-50%,-50%) rotate(-3deg);opacity:.95}
.slot{
  min-width:96px;height:78px;border:2.5px dashed var(--line-strong);border-radius:12px;
  display:grid;place-items:center;background:var(--surface-2);color:var(--ink-3);font-size:.85rem;
}
.slot.on{border-color:var(--accent);background:var(--accent-soft);border-style:solid}
.slot.has{border-style:solid;border-color:var(--teal);background:var(--teal-soft)}

/* ── 원(조각) 모형 ────────────────────────────────────── */
.discs{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.disc{width:96px;height:96px;position:relative;cursor:pointer;flex:none}
.disc svg{display:block;width:100%;height:100%}
.disc.done{cursor:default}
.disc:not(.done):hover svg circle{stroke:var(--accent)}
.disc .hint{position:absolute;inset:auto 0 -22px 0;text-align:center;font-size:.72rem;color:var(--accent);font-family:"IBM Plex Mono",monospace}

/* ── 버튼 ─────────────────────────────────────────────── */
.btn{
  border:0;border-radius:12px;padding:16px 26px;font-weight:700;font-family:"Gothic A1",sans-serif;
  font-size:1.02rem;cursor:pointer;background:var(--surface-3);color:var(--ink);box-shadow:var(--shadow-1)
}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--accent);color:#fff}
.btn.tl{background:var(--teal);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:11px 18px;font-size:.92rem;border-radius:10px}
.btn.ghost{background:none;border:2px solid var(--line-strong);color:var(--ink-2);box-shadow:none}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}

/* ── 피드백 ───────────────────────────────────────────── */
.msg{border-radius:12px;padding:16px 20px;font-size:1.02rem;display:flex;gap:14px;align-items:flex-start;line-height:1.55}
.msg .m-k{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:.72rem;letter-spacing:.12em;flex:none;margin-top:4px;padding:4px 8px;border-radius:5px}
.msg.ok{background:var(--good-soft);color:var(--good)} .msg.ok .m-k{background:var(--good);color:#fff}
.msg.no{background:var(--accent-soft);color:var(--accent-ink)} .msg.no .m-k{background:var(--accent);color:#fff}
.msg.tip{background:var(--warn-soft);color:var(--warn)} .msg.tip .m-k{background:var(--warn);color:#fff}
.msg b{font-weight:600}
.msg.hide{display:none}

/* 개념 정리 카드 */
.rule{
  background:var(--teal-soft);border:2px solid var(--teal);border-radius:var(--r);padding:22px 24px;
  display:flex;flex-direction:column;gap:12px
}
.rule h4{margin:0;font-size:1rem;color:var(--teal-ink);font-family:"IBM Plex Mono",monospace;letter-spacing:.1em;font-weight:600;text-transform:uppercase}
.rule p{margin:0;color:var(--ink);font-size:1.05rem}

/* 선택형 문항 */
.mcq{display:flex;flex-direction:column;gap:12px}
.mcq .q{font-size:1.08rem;font-weight:600}
.opt{
  display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface-2);
  border:2px solid var(--line);border-radius:12px;padding:16px 20px;cursor:pointer;color:inherit;font-size:1.02rem
}
.opt:hover{border-color:var(--accent)}
.opt .k{
  width:34px;height:34px;flex:none;border-radius:9px;background:var(--surface-3);display:grid;place-items:center;
  font-family:"IBM Plex Mono",monospace;font-weight:600
}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.ok .k{background:var(--good);color:#fff}
.opt.no{border-color:var(--accent);background:var(--accent-soft)} .opt.no .k{background:var(--accent);color:#fff}
.opt:disabled{cursor:default}

/* 연습 문제 격자 */
.drill{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.dq{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.dq .qn{font-family:"IBM Plex Mono",monospace;font-size:.75rem;font-weight:600;letter-spacing:.12em;color:var(--ink-3)}
.dq.solved{border-color:var(--good);background:var(--good-soft)}

/* 방법 비교 2단 */
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.way{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px}
.way h5{margin:0;font-size:.95rem;font-family:"IBM Plex Mono",monospace;font-weight:600;letter-spacing:.06em;color:var(--accent)}
.way.solved{border-color:var(--good)}
@media (max-width:900px){.two{grid-template-columns:1fr}}

/* 하단 조작 바 */
.footbar{
  position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--line);box-shadow:0 -8px 26px -20px rgba(17,35,48,.5)
}
.footbar .wrap{display:flex;align-items:center;gap:16px;min-height:88px}
.footbar .prog{font-family:"IBM Plex Mono",monospace;font-size:.85rem;color:var(--ink-3)}
.footbar .lock{font-size:.9rem;color:var(--ink-3)}

/* 수직선 */
.nline{position:relative;height:64px;margin-top:10px}
.nline .axis{position:absolute;left:0;right:0;top:26px;height:3px;background:var(--line-strong)}
.nline .tk{position:absolute;top:16px;width:2px;height:22px;background:var(--line-strong)}
.nline .tl{position:absolute;top:42px;transform:translateX(-50%);font-family:"IBM Plex Mono",monospace;font-size:.75rem;color:var(--ink-3);white-space:nowrap}
.seg{position:absolute;top:0;height:22px;border-radius:6px;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:.8rem;font-weight:600;color:#fff}
.seg.t{background:var(--teal)} .seg.a{background:var(--accent)}
.seg.ghost{background:none;border:2.5px dashed var(--line-strong);color:var(--ink-3)}
</style>
</head>
<body>
<div id="app">
  <header class="topbar"><div class="wrap">
    <div class="brand"><span class="dot"></span><span>분수의 나눗셈 실험실</span><small>6-2 · 1단원</small></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btn-install" hidden>앱 설치</button>
    <button class="iconbtn" id="btn-home">차시 목록</button>
    <button class="iconbtn" id="btn-reset">기록 지우기</button>
  </div></header>
  <div id="view"></div>
</div>
<div id="ghost" hidden></div>

<script>
/* ══════════════════════════════════════════════════════════
   1. 기본 도구
   ══════════════════════════════════════════════════════════ */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function H(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;}

/* 분수 표기 — 값이 '_3' 이면 3번 빈칸이 된다 */
function BL(i,w){return '<input class="blank" data-b="'+i+'" inputmode="numeric" autocomplete="off"'+(w?' style="min-width:'+w+'px"':'')+'>';}
function T(v){return (typeof v==='string'&&v[0]==='_')?BL(v.slice(1)):'<span class="num">'+v+'</span>';}
function F(n,d,w,cls){
  const st='<span class="st"><span class="n">'+T(n)+'</span><span class="d">'+T(d)+'</span></span>';
  return '<span class="fr '+(cls||'')+'">'+(w!=null?'<span class="w">'+T(w)+'</span>':'')+st+'</span>';
}
function N(v,cls){return '<span class="fr '+(cls||'')+'"><span class="w">'+T(v)+'</span></span>';}
const OP=s=>'<span class="op">'+s+'</span>';
const DIV=OP('÷'), MUL=OP('×'), EQ=OP('='), GT=OP('&gt;');
function eq(){return '<div class="eq">'+[].slice.call(arguments).join('')+'</div>';}

/* 저장 */
const KEY='fdlab-progress-v1';
let PROG={};
try{PROG=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){PROG={};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(PROG));}catch(e){}}
function pget(li){if(!PROG[li])PROG[li]=[0,0,0,0];return PROG[li];}
function pdone(li,si){pget(li)[si]=1;save();}

/* ══════════════════════════════════════════════════════════
   2. 드래그 엔진 (마우스·터치 공용)
   ══════════════════════════════════════════════════════════ */
const DND={zones:[],cur:null,active:null};
function zone(node,opt){
  opt=opt||{};
  node.__z={accept:opt.accept||function(){return true;},drop:opt.drop||function(){}};
  DND.zones.push(node);
  return node;
}
function clearZones(){DND.zones=[];}
function source(node,payload,ghostHTML){
  node.__p=payload; node.__g=ghostHTML||node.outerHTML;
  node.style.touchAction='none';
  node.addEventListener('pointerdown',startDrag);
  return node;
}
function startDrag(ev){
  const n=ev.currentTarget;
  if(n.classList.contains('used')||n.classList.contains('locked')){
    if(n.__onBlocked)n.__onBlocked(); return;
  }
  ev.preventDefault();
  const g=$('#ghost'); g.innerHTML=n.__g; g.hidden=false;
  DND.active={node:n,payload:n.__p};
  moveDrag(ev);
  window.addEventListener('pointermove',moveDrag);
  window.addEventListener('pointerup',endDrag,{once:true});
}
function moveDrag(ev){
  const g=$('#ghost'); g.style.left=ev.clientX+'px'; g.style.top=ev.clientY+'px';
  let best=null,bestA=Infinity;
  for(const z of DND.zones){
    if(!z.isConnected)continue;
    const r=z.getBoundingClientRect();
    if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom){
      const a=r.width*r.height;
      if(a<bestA&&z.__z.accept(DND.active.payload)){best=z;bestA=a;}
    }
  }
  if(DND.cur&&DND.cur!==best)DND.cur.classList.remove('on');
  DND.cur=best; if(best)best.classList.add('on');
}
function endDrag(ev){
  window.removeEventListener('pointermove',moveDrag);
  $('#ghost').hidden=true;
  if(DND.cur){DND.cur.classList.remove('on'); DND.cur.__z.drop(DND.active.payload,DND.active.node);}
  DND.cur=null; DND.active=null;
}

/* ══════════════════════════════════════════════════════════
   3. 모형 부품
   ══════════════════════════════════════════════════════════ */
function bar(parts,opts){
  opts=opts||{};
  const w=h('div','barwrap');
  if(opts.top) w.append(H('<div class="barlabel">'+opts.top+'</div>'));
  const b=h('div','bar'+(opts.slim?' h56':'')); b.style.gridTemplateColumns='repeat('+parts+',1fr)';
  for(let i=0;i<parts;i++){const c=h('div','cell');c.dataset.i=i;b.append(c);}
  w.append(b);
  if(opts.scale){
    const s=h('div','scale'); s.style.gridTemplateColumns='repeat('+parts+',1fr)';
    for(let i=0;i<parts;i++)s.append(h('span',null,opts.scale(i)||''));
    w.append(s);
  }
  w.bar=b; w.cells=[].slice.call(b.children); w.parts=parts;
  w.setFill=function(k,cls){w.cells.forEach(function(c,i){c.className='cell'+(i<k?' '+(cls||'f'):'');});};
  if(opts.fill!=null)w.setFill(opts.fill,opts.cls);
  return w;
}
function vessel(cap,label){
  const v=h('div','vessel');
  v.innerHTML='<span class="cap">'+(label||'')+'</span><div class="fillbar" style="height:0"></div><span class="cnt"></span>';
  v.cap=cap; v.n=0;
  v.set=function(n){v.n=n; $('.fillbar',v).style.height=(100*n/cap)+'%';
    $('.cnt',v).textContent=n?n+'/'+cap:''; v.classList.toggle('full',n>=cap);};
  return v;
}
function nline(parts,labels){
  const n=h('div','nline');
  n.innerHTML='<div class="axis"></div>';
  for(let i=0;i<=parts;i++){
    const p=100*i/parts;
    n.append(H('<div class="tk" style="left:calc('+p+'% - 1px)"></div>'));
    if(labels&&labels[i]!=null)n.append(H('<div class="tl" style="left:'+p+'%">'+labels[i]+'</div>'));
  }
  n.seg=function(from,to,cls,text){
    const s=H('<div class="seg '+cls+'" style="left:'+(100*from/parts)+'%;width:'+(100*(to-from)/parts)+'%">'+(text||'')+'</div>');
    n.append(s); return s;
  };
  return n;
}
function disc(d,opts){
  opts=opts||{};
  const w=h('div','disc'+(opts.done?' done':''));
  w.draw=function(cut){
    const R=44,C=48; let g='';
    if(cut){for(let i=0;i<d;i++){const a=-90+360*i/d;
      const x=C+R*Math.cos(a*Math.PI/180),y=C+R*Math.sin(a*Math.PI/180);
      g+='<line x1="'+C+'" y1="'+C+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--teal)" stroke-width="2.5"/>';}}
    const body=opts.half
      ? '<circle cx="48" cy="48" r="'+R+'" fill="none" stroke="var(--line-strong)" stroke-width="3"/><path d="M48 4 A44 44 0 0 1 48 92 Z" fill="var(--teal-soft)"/>'
      : '<circle cx="48" cy="48" r="'+R+'" fill="var(--teal-soft)" stroke="var(--line-strong)" stroke-width="3"/>';
    w.innerHTML='<svg viewBox="0 0 96 96">'+body+g+'</svg>'+((!cut&&!opts.done)?'<span class="hint">클릭</span>':'');
  };
  w.draw(!!opts.cut); return w;
}

/* 기준 막대에 비례하는 폭을 가진 '틀/자' 카드.
   n/d 만큼의 실제 길이로 보이므로 카드와 양을 곧바로 연결할 수 있다. */
function frameToken(refEl,n,d,label,cls){
  const inner='<span class="g" style="grid-template-columns:repeat('+n+',1fr)">'+
    new Array(n).fill('<i></i>').join('')+'</span><span class="l">'+label+'</span>';
  const t=h('div','token ftok '+(cls||'a'),inner);
  t.style.width=(100*n/d)+'%'; t.style.height='80px';
  t.addEventListener('pointerdown',function(){
    const w=refEl.getBoundingClientRect().width*n/d;
    t.__g='<div class="token ftok '+(cls||'a')+'" style="width:'+Math.round(w)+
      'px;height:80px">'+inner+'</div>';
  });
  return t;
}

/* ══════════════════════════════════════════════════════════
   4. 정답 확인 · 선택형
   ══════════════════════════════════════════════════════════ */
function norm(s){return String(s).replace(/\s/g,'');}
function checker(scope,spec){
  const answers=spec.answers, hints=spec.hints||{};
  const btn=h('button','btn pri',spec.label||'확인');
  const inputs=function(){return $$('input[data-b]',scope).sort(function(a,b){return a.dataset.b-b.dataset.b;});};
  let tries=0, solved=false;
  const run=function(){
    if(solved)return;
    let bad=[],empty=0;
    inputs().forEach(function(inp){
      const key=inp.dataset.b, want=answers[key];
      if(want==null)return;
      const v=norm(inp.value);
      if(v==='')empty++;
      const list=(Array.isArray(want)?want:[want]).map(norm);
      const ok=list.indexOf(v)>=0;
      inp.classList.toggle('ok',ok); inp.classList.toggle('no',!ok&&v!=='');
      if(!ok)bad.push({inp:inp,key:key,v:v});
    });
    if(!bad.length){
      solved=true; btn.disabled=true; btn.textContent='잘했어요';
      spec.msg&&spec.msg('ok',spec.okMsg||'모두 맞았어요.');
      spec.onSolved&&spec.onSolved();
      return;
    }
    tries++;
    let m=null;
    for(const b of bad){ const hh=hints[b.key]; if(hh&&hh[b.v]){m=hh[b.v];break;} }
    if(!m&&empty)m='빈칸을 모두 채워 볼까요?';
    if(!m)m=(tries>=2&&spec.tip)?spec.tip:'빨간 칸을 다시 살펴보세요.';
    spec.msg&&spec.msg(tries>=2?'tip':'no',m);
  };
  btn.addEventListener('click',run);
  scope.addEventListener('keydown',function(e){if(e.key==='Enter')run();});
  return btn;
}
function mcq(spec){
  const w=h('div','mcq'); w.append(H('<div class="q">'+spec.q+'</div>'));
  const btns=spec.options.map(function(o,i){
    const b=h('button','opt','<span class="k">'+'㉠㉡㉢㉣'[i]+'</span><span>'+o.label+'</span>');
    b.addEventListener('click',function(){
      if(o.correct){
        b.classList.add('ok'); btns.forEach(function(x){x.disabled=true;});
        spec.msg&&spec.msg('ok',o.feedback||'맞았어요.'); spec.onSolved&&spec.onSolved();
      }else{
        b.classList.add('no'); b.disabled=true;
        spec.msg&&spec.msg('no',o.feedback||'다시 생각해 볼까요?');
      }
    });
    w.append(b); return b;
  });
  return w;
}
function drill(items,ctx,intro){
  const wrap=h('div','col');
  if(intro)wrap.append(H('<div class="note">'+intro+'</div>'));
  const g=h('div','drill'); wrap.append(g);
  let left=items.length;
  items.forEach(function(it,i){
    const card=h('div','dq');
    card.append(H('<span class="qn">문제 '+(i+1)+'</span>'));
    card.append(H('<div class="col">'+it.html+'</div>'));
    const row=h('div','row');
    const btn=checker(card,{answers:it.answers,hints:it.hints,tip:it.tip,label:'확인',
      msg:function(k,m){let b=$('.msg',card); if(!b){b=h('div','msg');card.append(b);}
        b.className='msg '+k;
        b.innerHTML='<span class="m-k">'+(k==='ok'?'정답':'다시')+'</span><span>'+m+'</span>';},
      onSolved:function(){card.classList.add('solved');
        if(--left===0){ctx.done();ctx.say('ok','연습을 모두 해결했어요. 이 차시를 마쳤습니다.');}}});
    btn.classList.add('sm'); row.append(btn); card.append(row); g.append(card);
  });
  return wrap;
}

/* ══════════════════════════════════════════════════════════
   5. 화면 전환
   ══════════════════════════════════════════════════════════ */
const STEPKIND=[['STEP 1','구체물로 조작하기'],['STEP 2','그림으로 나타내기'],['STEP 3','식으로 쓰기'],['STEP 4','규칙 찾고 연습하기']];

function renderHome(){
  clearZones();
  const v=$('#view'); v.innerHTML='';
  const hero=h('section','hero');
  hero.append(H('<div class="wrap">'+
    '<div class="eyebrow">6학년 2학기 · 1단원 · 분수의 나눗셈</div>'+
    '<h1>손으로 옮겨 보고, 그림으로 확인하고,<br>그다음에 식을 씁니다.</h1>'+
    '<p>남극 과학 기지의 관측 상황으로 여섯 차시를 공부합니다. 각 차시는 네 단계로 나뉘어 있고, 앞 단계를 해결해야 다음 단계가 열립니다.</p>'+
    '<div class="flowline">'+STEPKIND.map(function(s,i){return '<div class="fl"><b>'+(i+1)+'</b>'+s[1]+'</div>';}).join('<span class="arw">→</span>')+'</div>'+
    '</div>'));
  v.append(hero);
  const g=h('div','grid');
  LESSONS.forEach(function(L,i){
    const p=pget(i), n=p.filter(Boolean).length;
    const c=h('button','card');
    c.innerHTML='<span class="no">'+L.no+'차시</span><h3>'+L.title+'</h3><p class="sub">'+L.sub+'</p>'+
      '<div class="expr">'+L.expr+'</div>'+
      '<div class="dots">'+p.map(function(x){return '<i class="'+(x?'on':'')+'"></i>';}).join('')+'<span>'+n+'/4</span></div>';
    c.addEventListener('click',function(){go(i,firstOpen(i));});
    g.append(c);
  });
  const wrap=h('div','wrap'); wrap.append(g); v.append(wrap);
}
function firstOpen(li){const p=pget(li);for(let i=0;i<4;i++)if(!p[i])return i;return 3;}
function canOpen(li,si){const p=pget(li);return si===0||p[si-1]===1||p[si]===1;}

function go(li,si){
  clearZones();
  const L=LESSONS[li], v=$('#view'); v.innerHTML='';
  const head=h('header','lessonhead');
  head.append(H('<div class="wrap">'+
    '<div class="lh-top"><span class="no">'+L.no+'차시</span><h2>'+L.title+'</h2><span class="goal">'+L.goal+'</span></div>'+
    '<nav class="steps"></nav></div>'));
  const nav=$('.steps',head);
  const stepBtns=STEPKIND.map(function(s,i){
    const b=h('button',(i===si?'cur ':'')+(pget(li)[i]?'ok':''),
      '<span class="k">'+s[0]+'</span><span class="t">'+(L.steps[i].label||s[1])+'</span>');
    b.disabled=!canOpen(li,i);
    b.addEventListener('click',function(){go(li,i);}); nav.append(b); return b;
  });
  v.append(head);

  const main=h('main'), wrap=h('div','wrap'); main.append(wrap); v.append(main);
  const st=L.steps[si];
  wrap.append(H('<div class="task"><span class="lab">할 일</span><span class="txt">'+st.task+'</span></div>'));
  const stage=h('div','stage'), board=h('div','board'), panel=h('div','panel'), msg=h('div','msg hide');
  stage.append(board,panel,msg); wrap.append(stage);

  const foot=h('footer','footbar'); v.append(foot);
  const fw=h('div','wrap'); foot.append(fw);
  const prev=h('button','btn ghost','← 이전');
  prev.addEventListener('click',function(){si>0?go(li,si-1):renderHome();});
  const next=h('button','btn pri',si<3?'다음 단계 →':'차시 목록으로 →');
  const lock=h('span','lock','활동을 해결하면 다음 단계가 열립니다.');
  next.disabled=!pget(li)[si];
  if(!next.disabled)lock.textContent='';
  next.addEventListener('click',function(){si<3?go(li,si+1):renderHome();});
  fw.append(prev,h('span','prog',L.no+'차시 · '+STEPKIND[si][0]+' / 4'),h('span','spacer'),lock,next);

  const ctx={
    board:board,panel:panel,stage:stage,li:li,si:si,
    say:function(kind,html){msg.className='msg '+kind;
      msg.innerHTML='<span class="m-k">'+(kind==='ok'?'좋아요':kind==='tip'?'힌트':'다시')+'</span><span>'+html+'</span>';},
    hide:function(){msg.className='msg hide';},
    done:function(){pdone(li,si);next.disabled=false;lock.textContent='';stepBtns[si].classList.add('ok');
      for(let k=0;k<4;k++)stepBtns[k].disabled=!canOpen(li,k);},
    isDone:function(){return !!pget(li)[si];}
  };
  ctx.check=function(scope,spec){spec=spec||{};spec.msg=ctx.say;return checker(scope,spec);};
  ctx.mcq=function(spec){spec.msg=ctx.say;return mcq(spec);};
  st.build(ctx);
  window.scrollTo(0,0);
}
$('#btn-home').addEventListener('click',renderHome);
$('#btn-reset').addEventListener('click',function(){
  if(confirm('이 컴퓨터에 저장된 진행 기록을 모두 지울까요?')){PROG={};save();renderHome();}
});
</script>

<script>
var LESSONS=[];

/* ══════════════════════════════════════════════════════════
   1차시 · 분모가 같은 (분수)÷(분수) ① 나누어떨어지는 경우
   ══════════════════════════════════════════════════════════ */
LESSONS.push({
 no:1, title:'분모가 같은 분수의 나눗셈 ①',
 sub:'분자끼리 나누어떨어지는 경우',
 goal:'단위분수가 몇 개인지 세어 분자끼리 나눕니다.',
 expr:eq(F(7,10),DIV,F(1,10),EQ,'<span class="num">7</span>'),
 steps:[
 /* ── STEP 1 ─────────────────────────────────────────── */
 {label:'비료 덜어내기',
  task:'식물 공장의 비료 <em>7/10 kg</em>을 화분 한 개에 <em>1/10 kg</em>씩 담습니다. 막대의 칸을 <em>끌어서</em> 화분에 옮겨 보세요.',
  build:function(ctx){
    const sc=h('div','scene');
    sc.append(H('<h4>식물 공장 · 비료 나누어 담기</h4>'));
    const b=bar(10,{fill:7,
      top:'<span>비료 '+F(7,10,null,'sm')+' kg</span><span class="note">한 칸 = '+F(1,10,null,'sm')+' kg</span>'});
    sc.append(b);
    const info=H('<div class="row center" style="margin-top:16px"><span class="tag a">덜어낸 횟수 <b class="cnt">0</b>번</span><span class="tag t">남은 비료 <b class="rest">7</b>칸</span></div>');
    sc.append(info);
    sc.append(H('<div class="note" style="margin-top:18px">화분 — 한 개에 '+F(1,10,null,'sm')+' kg</div>'));
    const vs=h('div','vessels'); const pots=[];

             4:{'0':'1이 2개 들어 있으니 자연수 부분은 2입니다.'}},
      tip:'5 ÷ 2 = 5/2 = 2와 1/2',
      okMsg:'나누어떨어지지 않으면 몫을 <b>분수</b>로 나타냅니다.',
      onSolved:function(){ctx.done();}});
    const row=h('div','row'); row.append(chk); p.append(row);
    ctx.panel.append(p);
    ctx.say('tip','반 조각 카드를 그릇으로 끌어다 놓으세요. 앞의 그릇부터 채웁니다.');

 /* ── STEP 4 ─────────────────────────────────────────── */
 {label:'연습',
  task:'분자끼리 나눈 몫을 <em>가분수</em>로 나타내세요. 네 문제를 모두 해결하면 차시가 끝납니다.',
  build:function(ctx){

      {html:eq(F(7,8),DIV,F(5,8),EQ,F('_0','_1')),answers:{0:'7',1:'5'},tip:'7 ÷ 5 = 7/5'},

    ],ctx,'분모는 나누지 않습니다. 분자끼리만 나누어 분수로 쓰세요.'));
  }}
 ]});

        {label:'3/4이 4/7보다 크기 때문',feedback:'크기 차이가 아니라 <b>단위가 다른 것</b>이 문제예요.'},

 /* ── STEP 2 ─────────────────────────────────────────── */
 {label:'눈금 맞추기',

    function draw(){

      const okA=(n*3)%4===0, okB=(n*4)%7===0;

 /* ── STEP 3 ─────────────────────────────────────────── */
 {label:'식으로 쓰기',

             2:{'3':'통분한 분자는 21입니다.'},

      tip:'21/28 ÷ 16/28 → 21 ÷ 16 → 21/16 → 1과 5/16',
      okMsg:'통분해서 <b>같은 단위</b>로 만든 뒤 분자끼리 나누었습니다.',

 /* ── STEP 4 ─────────────────────────────────────────── */
 {label:'연습',

<script>
/* ══════════════════════════════════════════════════════════
   4차시 · (자연수)÷(분수)
   ══════════════════════════════════════════════════════════ */
LESSONS.push({
 no:4, title:'(자연수) ÷ (분수)',
 sub:'1시간 동안 갈 수 있는 거리 — 단위량 구하기',
 goal:'자연수를 분자로 나누고 분모를 곱합니다.',
 expr:eq(N(6),DIV,F(2,3),EQ,N(9)),
 steps:[
 /* ── STEP 1 ─────────────────────────────────────────── */
 {label:'1시간 채우기',
  task:'아라온호가 <em>2/3시간</em>에 <em>6 km</em>를 갔습니다. ①「반으로 나누기」 카드를 색칠된 구간에 놓고, ② 만들어진 「3 km」 카드를 빈 구간에 놓아 1시간을 채우세요.',
  build:function(ctx){
    const sc=h('div','scene'); sc.append(H('<h4>아라온호 · 1시간 동안 몇 km?</h4>'));
    const b=bar(3,{top:'<span>2/3시간에 6 km</span><span class="note">한 칸 = '+F(1,3,null,'sm')+'시간</span>',
      scale:function(i){return ['0 ~ 1/3','1/3 ~ 2/3','2/3 ~ 1'][i];}});
    b.setFill(2,'fa');
    b.cells[0].append(H('<span class="mark" data-r="0"></span>'));
    b.cells[1].append(H('<span class="mark" data-r="1"></span>'));
    b.cells[2].append(H('<span class="mark" data-r="2"></span>'));
    $('[data-r="0"]',b.bar).innerHTML='<span style="font-size:1.1rem">6 km 구간</span>';
    sc.append(b);
    const tot=H('<div class="row center" style="margin-top:16px"><span class="tag t">1시간 동안 <b class="q">?</b> km</span></div>');
    sc.append(tot);
    sc.append(H('<div class="note" style="margin-top:22px">카드</div>'));
    const cr=h('div','row');
    const knife=h('div','token a','반으로<br>나누기');
    const half=frameToken(b.bar,1,3,'3 km','');
    half.classList.add('locked');
    half.__onBlocked=function(){ctx.say('tip','먼저 「반으로 나누기」 카드로 6 km 구간을 반으로 나누어야 3 km가 생겨요.');};
    const hh=h('div','ftok-holder'); hh.append(half);
    cr.append(knife); sc.append(cr,H('<div class="note" style="margin-top:16px">'+
      '아래 카드는 '+F(1,3,null,'sm')+'시간 구간과 폭이 같습니다</div>'),hh);
    ctx.board.append(sc);

    let cut=false, filled=false;
    source(knife,'knife'); source(half,'half');
    [0,1].forEach(function(i){
      zone(b.cells[i],{accept:function(p){return p==='knife'&&!cut;},drop:function(){
        cut=true; knife.classList.add('used'); half.classList.remove('locked');
        $('[data-r="0"]',b.bar).innerHTML='<span style="font-size:1.05rem">3 km</span>';
        $('[data-r="1"]',b.bar).innerHTML='<span style="font-size:1.05rem">3 km</span>';
        ctx.say('ok',F(2,3,null,'sm')+'시간을 반으로 나누면 '+F(1,3,null,'sm')+'시간이고, 그 동안 <b>3 km</b>를 갑니다. 이제 「3 km」 카드로 빈 구간을 채우세요.');
      }});
    });
    zone(b.cells[2],{accept:function(p){return p==='half'&&cut&&!filled;},drop:function(){
      if(!cut||filled)return;
      filled=true; half.classList.add('used');

 {label:'실험과 연습',

 ]});

 {label:'수조 가득 채우기',
